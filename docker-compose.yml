version: "3.9"
services:
  api:
    build: .
    env_file: .env.example
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    # Health check hits your /health route
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017"
    depends_on:
      - mongo

volumes:
  mongo_data:

