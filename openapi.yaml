openapi: 3.0.3
info:
  title: Expense Tracker API
  description: >
    Focused expense-tracker backend: categories, expenses, recurring expense
    templates, budgets (per-category and overall), savings accounts (with
    add/withdraw), savings goals, monthly summaries, and in-app-only
    notifications (no email/push/SMS). This branch does not track income,
    investments, debt, or net worth — see the `release`/`main` branches for
    the full money tracker.
  version: "3.0.0"

servers:
  - url: /

tags:
  - name: health
    description: Health and diagnostics
  - name: auth
    description: Authentication and account operations
  - name: profile
    description: Profile-related endpoints for the authenticated user
  - name: category
    description: Expense category management
  - name: expenses
    description: Expense entries
  - name: bank-accounts
    description: Savings accounts — balances, and add/withdraw
  - name: recurring
    description: Recurring expense templates
  - name: budgets
    description: Per-category and overall spend budgets
  - name: goals
    description: Savings goals linked to a savings account
  - name: notifications
    description: In-app notifications (no email/push/SMS)
  - name: summary
    description: Monthly expense reporting and savings balance

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Invalid request payload or validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        request_id: { type: string }

    # ---- auth ----
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: Must contain at least one letter and one digit.
    RegisterResponse:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT (30 minutes).
        refresh_token:
          type: string
          description: Opaque, DB-backed, rotates on every use (30 days).
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    ResetPasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password:
          type: string
          minLength: 8
          description: Must contain at least one letter and one digit.
    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }

    # ---- category ----
    Category:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [expense] }
        color: { type: string, example: "#FF5733" }
        icon: { type: string, example: "🛒" }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, enum: [expense], default: expense }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        icon: { type: string }
    CategoryUpdateRequest:
      type: object
      properties:
        name: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        icon: { type: string }
        archived:
          type: boolean
          description: >
            Setting true is blocked (400) if non-deleted expenses still
            reference this category, unless reassign_to is also supplied.
        reassign_to:
          type: string
          description: Category ID to bulk-move referencing expenses to before archiving.

    # ---- expenses ----
    Expense:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        amount: { type: number }
        date: { type: string, format: date-time }
        category_id: { type: string }
        merchant: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExpenseCreateRequest:
      type: object
      required: [amount, category_id]
      properties:
        amount: { type: number }
        category_id: { type: string }
        date: { type: string, format: date-time }
        merchant: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
    ExpenseUpdateRequest:
      type: object
      properties:
        amount: { type: number }
        category_id: { type: string }
        date: { type: string, format: date-time }
        merchant: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }

    # ---- bank accounts (savings accounts) ----
    BankAccount:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        balance:
          type: number
          description: >
            Only ever moved via POST /bank-accounts/{id}/adjust (add/withdraw)
            or the initial create balance — never edited directly.
        interest_rate: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BankAccountCreateRequest:
      type: object
      required: [name, balance]
      properties:
        name: { type: string }
        balance: { type: number, minimum: 0 }
        interest_rate: { type: number }
    BankAccountAdjustRequest:
      type: object
      required: [direction, amount]
      properties:
        direction: { type: string, enum: [add, withdraw] }
        amount: { type: number, exclusiveMinimum: 0 }
        note:
          type: string
          description: Optional; recorded in the audit log alongside the change.
    BankAccountLedgerEntry:
      type: object
      properties:
        id: { type: string }
        bank_account_id: { type: string }
        type: { type: string, enum: [opening, add, withdraw] }
        amount: { type: number, description: Always positive; direction comes from type. }
        note: { type: string }
        balance_after: { type: number }
        created_at: { type: string, format: date-time }

    # ---- recurring ----
    RecurringTemplate:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        entity_type: { type: string, enum: [expense] }
        frequency: { type: string, enum: [monthly, yearly] }
        day_of_month:
          type: integer
          description: >
            Target day, clamped to the last day of a shorter month without
            drifting in later months (e.g. 31st in Feb → 28th/29th, then back
            to the 31st in March).
        payload:
          type: object
          description: "{amount, category_id, merchant?, notes?}"
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time, nullable: true }
        next_run_date: { type: string, format: date-time }
        last_run_date: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecurringCreateRequest:
      type: object
      required: [entity_type, frequency, day_of_month, payload, start_date]
      properties:
        entity_type: { type: string, enum: [expense] }
        frequency: { type: string, enum: [monthly, yearly] }
        day_of_month: { type: integer, minimum: 1, maximum: 31 }
        payload: { type: object }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
    RecurringUpdateRequest:
      type: object
      properties:
        day_of_month: { type: integer, minimum: 1, maximum: 31 }
        payload: { type: object }
        end_date: { type: string, format: date-time }
        active: { type: boolean }

    # ---- budgets ----
    Budget:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        category_id:
          type: string
          nullable: true
          description: Absent/null means an overall spend cap.
        amount: { type: number }
        effective_from: { type: string, example: "2026-07" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BudgetCreateRequest:
      type: object
      required: [amount, effective_from]
      properties:
        category_id:
          type: string
          nullable: true
          description: Omit or null for an overall cap.
        amount: { type: number }
        effective_from:
          type: string
          example: "2026-07"
          description: >
            YYYY-MM. Setting a new month creates a new effective-dated row
            (history preserved); the same (category, month) pair upserts.
    BudgetStatus:
      type: object
      description: >
        Only present for categories with a budget configured — an unbudgeted
        category is simply absent, not a false 0%/not-exceeded entry.
      properties:
        category_id:
          type: string
          description: Absent for the overall-cap entry.
        budgeted: { type: number }
        spent: { type: number }
        percent_used: { type: number }
        exceeded: { type: boolean }

    # ---- goals ----
    Goal:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        target_amount: { type: number }
        target_date: { type: string, format: date-time, nullable: true }
        linked_type: { type: string, enum: [bank_account] }
        linked_id: { type: string }
        status: { type: string, enum: [active, completed, abandoned] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_value:
          type: number
          description: Live-resolved from the linked savings account's current balance at read time.
        percent_complete:
          type: number
          description: Capped at 100 even when overfunded.
        linked_entity_missing:
          type: boolean
          description: True if the linked savings account was deleted; progress then reads as 0 rather than erroring.
    GoalCreateRequest:
      type: object
      required: [name, target_amount, linked_type, linked_id]
      properties:
        name: { type: string }
        target_amount: { type: number }
        target_date: { type: string, format: date-time }
        linked_type: { type: string, enum: [bank_account] }
        linked_id: { type: string }
    GoalUpdateRequest:
      type: object
      properties:
        name: { type: string }
        target_amount: { type: number }
        target_date: { type: string, format: date-time }
        status: { type: string, enum: [active, completed, abandoned] }

    # ---- notifications ----
    Notification:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [budget_exceeded, bill_due] }
        title: { type: string }
        message: { type: string }
        related_entity_type: { type: string }
        related_entity_id: { type: string }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
        dismissed_at: { type: string, format: date-time, nullable: true }
    UnreadCountResponse:
      type: object
      properties:
        unread_count: { type: integer }

    # ---- summary ----
    SummaryResult:
      type: object
      properties:
        expense_total: { type: number }
        savings_balance:
          type: number
          description: >
            Current total across all savings accounts — independent of the
            month query param used for expense_total/category_breakdown.
        category_breakdown:
          type: array
          items:
            type: object
            properties:
              category_id: { type: string }
              category_name: { type: string }
              total: { type: number }
        budget_status:
          type: array
          items: { $ref: '#/components/schemas/BudgetStatus' }
        overall_budget:
          allOf: [{ $ref: '#/components/schemas/BudgetStatus' }]
          nullable: true
    MonthlyComparison:
      type: object
      properties:
        month:
          type: string
          example: "2026-07"
        expense: { type: number }
        budget_status:
          type: array
          items: { $ref: '#/components/schemas/BudgetStatus' }
        overall_budget:
          allOf: [{ $ref: '#/components/schemas/BudgetStatus' }]
          nullable: true

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: API is healthy

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Rate limited }

  /auth/login:
    post:
      tags: [auth]
      summary: Login and receive an access + refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limited }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access + refresh token pair (rotates)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair; the old refresh token is invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limited }

  /auth/me:
    get:
      tags: [profile]
      summary: Fetch the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout — revokes all refresh tokens for the user
      security:
        - bearerAuth: []
      responses:
        '200': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/reset-password:
    post:
      tags: [profile]
      summary: Change the authenticated user's password
      description: Requires the current password; revokes all refresh tokens on success.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Password changed successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories:
    get:
      tags: [category]
      summary: List categories
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: archived
          required: false
          schema: { type: boolean }
          description: |
            - `true`  → archived categories only
            - `false` → active categories only
            - omitted → all categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [category]
      summary: Create a category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories/{id}:
    put:
      tags: [category]
      summary: Update a category
      description: >
        Setting archived=true is blocked (400, message includes the
        referencing-expense count) unless reassign_to is also supplied.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdateRequest' }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /expenses:
    get:
      tags: [expenses]
      summary: List expenses for a month, optionally filtered by category
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema: { type: string, example: "2026-07" }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [expenses]
      summary: Add an expense entry
      description: >
        If this pushes the category over its budget for the month, an
        in-app budget_exceeded notification is raised (deduped per
        category per month) — no direct signal in this response.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /expenses/{id}:
    put:
      tags: [expenses]
      summary: Update an expense
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdateRequest' }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [expenses]
      summary: Soft-delete an expense
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bank-accounts:
    get:
      tags: [bank-accounts]
      summary: List bank accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BankAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [bank-accounts]
      summary: Create a bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bank-accounts/{id}:
    delete:
      tags: [bank-accounts]
      summary: Soft-delete a bank account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bank-accounts/{id}/adjust:
    post:
      tags: [bank-accounts]
      summary: Add money to or withdraw money from a savings account
      description: >
        Applies an atomic balance change and records it in the audit log.
        A withdrawal that would drive the balance negative is rejected
        (400) rather than allowed to overdraw.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountAdjustRequest' }
      responses:
        '200':
          description: Updated bank account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bank-accounts/{id}/ledger:
    get:
      tags: [bank-accounts]
      summary: List an account's ledger entries (opening balance + every add/withdraw)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: month
          in: query
          required: false
          schema: { type: string, example: "2026-07" }
          description: YYYY-MM. Omit for all-time.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BankAccountLedgerEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /recurring:
    get:
      tags: [recurring]
      summary: List recurring templates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecurringTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [recurring]
      summary: Create a recurring template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /recurring/{id}:
    put:
      tags: [recurring]
      summary: Update a recurring template
      description: Only affects future occurrences — already-materialized records are untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringUpdateRequest' }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [recurring]
      summary: Soft-delete a recurring template
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /budgets:
    get:
      tags: [budgets]
      summary: List every raw effective-dated budget row
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [budgets]
      summary: Set a budget (upserts by category + effective_from)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetCreateRequest' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /budgets/{id}:
    delete:
      tags: [budgets]
      summary: Delete a budget row
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /goals:
    get:
      tags: [goals]
      summary: List savings goals (with live-resolved progress)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [goals]
      summary: Create a savings goal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /goals/{id}:
    put:
      tags: [goals]
      summary: Update a savings goal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalUpdateRequest' }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [goals]
      summary: Soft-delete a savings goal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          schema: { type: boolean }
          description: Set to true to return only unread, non-dismissed notifications.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: Unread notification count (for a bell-icon badge)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark a notification as read (does not remove it from the list)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/{id}/dismiss:
    post:
      tags: [notifications]
      summary: Dismiss a notification (removes it from the list)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Dismissed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /summary:
    get:
      tags: [summary]
      summary: Monthly expense total + current savings balance + budget status
      description: >
        With no month query param, expense_total/category_breakdown/
        budget_status reflect all-time totals instead of a single month;
        savings_balance is always the current total regardless of month.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema: { type: string, example: "2026-07" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /summary/compare:
    get:
      tags: [summary]
      summary: Compare expense totals and budget status over recent months
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          required: false
          schema: { type: integer, default: 3, maximum: 12 }
          description: Number of months to compare
      responses:
        '200':
          description: Monthly comparison array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MonthlyComparison' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
